<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ResponseRewriter</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>ResponseRewriter</h1>
          <p class="hint">规则保存后会立刻同步到已打开页面。</p>
        </div>
        <div class="topbar-actions">
          <button id="addRuleButton" type="button">+ 新建规则</button>
          <button id="loadExampleButton" type="button">示例规则</button>
        </div>
      </header>

      <section class="layout">
        <aside class="sidebar">
          <div style="padding:14px 16px;border-bottom:1px solid var(--border-light);">
            <span style="font-weight:700;font-size:13px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.03em;">规则列表</span>
            <span style="float:right;font-size:11px;color:var(--text-muted);" id="ruleCount">0 条</span>
          </div>
          <div id="ruleList" class="rule-list"></div>
        </aside>

        <section class="editor">
          <form id="ruleForm" class="rule-form">
            <div class="row two">
              <label>
                <span>规则名称</span>
                <input id="ruleName" name="ruleName" type="text" maxlength="60" placeholder="例如：改写用户信息">
              </label>
              <label class="toggle">
                <span>启用规则</span>
                <input id="ruleEnabled" name="ruleEnabled" type="checkbox">
              </label>
            </div>

            <div class="row">
              <span class="section-label">拦截类型</span>
              <label class="checkline"><input id="typeXhr" type="checkbox" checked>XHR</label>
              <label class="checkline"><input id="typeFetch" type="checkbox" checked>Fetch</label>
            </div>

            <div class="row three">
              <label>
                <span>请求方法</span>
                <select id="matchMethod">
                  <option value="">全部</option>
                  <option value="GET">GET</option>
                  <option value="POST">POST</option>
                  <option value="PUT">PUT</option>
                  <option value="PATCH">PATCH</option>
                  <option value="DELETE">DELETE</option>
                </select>
              </label>
              <label>
                <span>状态码</span>
                <input id="matchStatus" type="text" inputmode="numeric" placeholder="例如 200">
              </label>
              <label>
                <span>响应包含</span>
                <input id="responseBodyIncludes" type="text" placeholder="可留空">
              </label>
            </div>

            <div class="row two">
              <label>
                <span>请求方法</span>
                <select id="matchMethod">
                  <option value="">全部</option>
                  <option value="GET">GET</option>
                  <option value="POST">POST</option>
                  <option value="PUT">PUT</option>
                  <option value="PATCH">PATCH</option>
                  <option value="DELETE">DELETE</option>
                </select>
              </label>
              <label>
                <span>URL 匹配（精确匹配路径，忽略 ? 参数）</span>
                <input id="urlMatchValue" type="text" placeholder="https://example.com/api/user/profile">
              </label>
            </div>

            <div class="row">
              <label>
                <span>改写方式</span>
                <select id="rewriteMode">
                  <option value="json-merge">JSON 合并</option>
                  <option value="replace">文本替换</option>
                  <option value="regex-replace">正则替换</option>
                  <option value="static">整段覆盖</option>
                </select>
              </label>
            </div>

            <div id="rewriteFields" class="rewrite-fields"></div>

            <div class="actions" style="justify-content:flex-end;">
              <button id="duplicateRuleButton" type="button">复制规则</button>
              <button id="deleteRuleButton" type="button" class="danger">删除规则</button>
              <button id="saveButton" type="submit" class="primary">保存规则</button>
            </div>
          </form>
        </section>
      </section>

      <div id="status"></div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="popup.js"></script>
  </body>
</html>
